name: Website Milestone Notifications

on:
  schedule:
    # Run daily at midnight to check for new milestones
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check-milestones:
    runs-on: ubuntu-latest
    steps:
      - name: Check website milestones and send notification
        uses: actions/github-script@v6
        with:
          script: |
            const fetch = require('node-fetch');
            
            const COUNTER_API = 'https://countapi.mileshilliard.com/api/v1/get/gustavopaiva9.com.br-visits';
            const DISCORD_WEBHOOK_URL = 'https://discord.com/api/webhooks/1562479228405161996/oEnWaN5Sw9Jy7APDyKnGOn96c1vBZ3Ttr2CtDAsRwHU4-Z4I8gcIbKQTPYqeLdY56cDG';
            const MILESTONE_THRESHOLDS = [400, 800, 1200, 1600, 2000];
            const LAST_NOTIFICATION_FILE = './last-notification.json';
            
            const fs = require('fs');
            
            // Check if notification was already sent
            let lastNotification = null;
            try {
              if (fs.existsSync(LAST_NOTIFICATION_FILE)) {
                lastNotification = JSON.parse(fs.readFileSync(LAST_NOTIFICATION_FILE, 'utf8'));
              }
            } catch (error) {
              console.log('No previous notification found');
            }
            
            async function checkMilestonesAndNotify() {
              try {
                // Get current hit count
                const response = await fetch(COUNTER_API);
                const data = await response.json();
                const currentHits = data.value;
                
                console.log(`Current website hits: ${currentHits}`);
                
                // Check for milestones reached
                const newlyReachedMilestones = MILESTONE_THRESHOLDS.filter(
                  threshold => currentHits >= threshold && 
                  (!lastNotification || lastNotification.milestones?.indexOf(threshold) === -1)
                );
                
                if (newlyReachedMilestones.length > 0) {
                  // Send Discord notification for each new milestone
                  for (const milestone of newlyReachedMilestones) {
                    const discordPayload = {
                      content: `🎉 **Website Milestone Reached!**\n\n` +
                               `**GPN Studio website reached ${milestone} hits!**\n\n` +
                               `👋 Obrigado pela visita!\n\n` +
                               `🌐 Site: https://gustavopaiva9.github.io/\n` +
                               `📅 Data: ${new Date().toLocaleDateString('pt-BR')}`,
                      username: 'GPN Studio Bot',
                      avatar_url: ''
                    };
                    
                    await fetch(DISCORD_WEBHOOK_URL, {
                      method: 'POST',
                      headers: {
                        'Content-Type': 'application/json',
                      },
                      body: JSON.stringify(discordPayload)
                    });
                    
                    console.log(`✅ Discord notification sent for ${milestone} hits!`);
                  }
                  
                  // Record notification
                  const notificationData = {
                    milestones: [...(lastNotification?.milestones || []), ...newlyReachedMilestones],
                    timestamp: new Date().toISOString(),
                    notified: true
                  };
                  
                  fs.writeFileSync(LAST_NOTIFICATION_FILE, JSON.stringify(notificationData, null, 2));
                  console.log('✅ Milestone notifications sent and recorded!');
                } else {
                  console.log('No new milestones reached');
                }
              } catch (error) {
                console.error('Error checking milestones:', error);
                throw error;
              }
            }
            
            await checkMilestonesAndNotify();
